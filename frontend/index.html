<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitMax Academy</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                🏋️
            </div>

            <h1>FITMAX</h1>

            <p class="subtitle">
                ACADEMY
            </p>

            <p class="description">
                Seu planejador fitness
            </p>

            <form id="loginForm">

                <label>E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label>Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                    <a href="javascript:void(0)"
   id="esqueciSenhaLink"
   class="link-recuperar">
    Esqueci minha senha &gt;
</a>
                    <a href="#" id="esqueciSenhaLink">
    Esqueci minha senha
</a>
                >

                <button type="submit">
                    ENTRAR
                </button>

            </form>
            <div id="recuperacaoBox" hidden>

    <h2>Recuperar senha</h2>

    <p>Informe seu e-mail para receber o código.</p>

    <form id="recuperacaoForm">

        <label>E-mail</label>

        <input
            type="email"
            id="emailRecuperacao"
            placeholder="Seu e-mail cadastrado"
            required
        >

        <button type="submit">
            ENVIAR CÓDIGO
        </button>

    </form>

    <form id="novaSenhaForm" hidden>

        <label>Código recebido</label>

        <input
            type="text"
            id="codigoRecuperacao"
            placeholder="Digite os 6 dígitos"
            maxlength="6"
            inputmode="numeric"
            required
        >

        <label>Nova senha</label>

        <input
            type="password"
            id="novaSenha"
            placeholder="Digite sua nova senha"
            minlength="8"
            required
            <a href="#" id="esqueciSenhaLink" class="link-recuperar">
    Esqueci minha senha?
</a>
        >

        <button type="submit">
            ALTERAR SENHA
        </button>

    </form>

    <p id="mensagemRecuperacao"></p>

    <a href="#" id="voltarLogin">
        Voltar para o login
    </a>

</div>

            <p id="mensagem"></p>

            <div class="login-footer">

                Ainda não possui uma conta?

                <a href="pages/cadastro.html">
                    Criar cadastro
                </a>

            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
