<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitMax Academy</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                🏋️
            </div>

            <h1>FITMAX</h1>

            <p class="subtitle">
                ACADEMY
            </p>

            <p class="description">
                Seu planejador fitness
            </p>

            <form id="loginForm">

                <label>E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label>Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    ENTRAR
                </button>

            </form>

            <p id="mensagem"></p>

            <div class="login-footer">

                Ainda não possui uma conta?

                <a href="pages/cadastro.html">
                    Criar cadastro
                </a>

            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
