<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - FitMax Academy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                🏋️
            </div>

            <h1>FITMAX</h1>

            <p class="subtitle">
                CRIAR CONTA
            </p>

            <form id="cadastroForm">

                <label>Nome</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label>E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label>Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    required
                >

                <button type="submit">
                    CRIAR CONTA
                </button>

            </form>

            <p id="mensagem"></p>

            <div class="login-footer">

                Já possui uma conta?

                <a href="../index.html">
                    Fazer login
                </a>

            </div>

        </section>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/cadastro.js"></script>

</body>

</html>
